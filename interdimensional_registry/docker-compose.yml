version: '3.8'

services:
  # 1. База данных PostgreSQL
  glitch_postgres:
    image: postgres:15-alpine
    container_name: glitch_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - glitch_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Первый инстанс бэкенда
  backend1:
    build: .
    container_name: glitch_backend_1
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=glitch_postgres
      - POSTGRES_PORT=5432
      - SERVER_ID=backend-node-1
    depends_on:
      glitch_postgres:
        condition: service_healthy

  # 3. Второй инстанс бэкенда
  backend2:
    build: .
    container_name: glitch_backend_2
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=glitch_postgres
      - POSTGRES_PORT=5432
      - SERVER_ID=backend-node-2
    depends_on:
      glitch_postgres:
        condition: service_healthy

  # 4. Nginx (Балансировщик и SSL-терминатор)
  nginx:
    image: nginx:latest
    container_name: glitch_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - backend1
      - backend2

volumes:
  glitch_data: