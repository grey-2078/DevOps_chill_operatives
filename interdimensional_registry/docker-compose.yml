services:
  glitch_postgres:
    image: postgres:15-alpine
    container_name: glitch_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - glitch_data:/var/lib/postgresql/data
    networks:
      - back_net
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

  backend1:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: glitch_backend_1
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=glitch_postgres
      - POSTGRES_PORT=5432
      - SERVER_ID=backend-node-1
    depends_on:
      glitch_postgres:
        condition: service_healthy
    networks:
      - back_net
      - front_net

  backend2:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: glitch_backend_2
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=glitch_postgres
      - POSTGRES_PORT=5432
      - SERVER_ID=backend-node-2
    depends_on:
      glitch_postgres:
        condition: service_healthy
    networks:
      - back_net
      - front_net

  react_frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: glitch_react_ui
    restart: always
    ports:
      - "3000:3000"
    networks:
      - front_net

  nginx:
    image: nginx:latest
    container_name: glitch_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - backend1
      - backend2
      - react_frontend
    networks:
      - front_net

volumes:
  glitch_data:

networks:
  front_net:
  back_net:
