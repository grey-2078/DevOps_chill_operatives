# Ограничение частоты запросов (защита /api)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# Балансировка нагрузки между двумя инстансами бэкенда на Streamlit
upstream streamlit_backend {
    server backend1:8501;
    server backend2:8501;
}

# 1. Основной проект (myapp.local) — Редирект с HTTP (порт 80) на HTTPS (порт 443)
server {
    listen 80;
    server_name myapp.local localhost;

    return 301 https://$host$request_uri;
}

# 2. Основной проект (myapp.local) — HTTPS
server {
    listen 443 ssl;
    server_name myapp.local localhost;

    # Подключение SSL-сертификатов
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Параметры SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # КРИТИЧЕСКИ ВАЖНО для 404: включаем перехват ошибок от проксируемого бэкенда
    proxy_intercept_errors on;

    # Кастомная страница 404
    error_page 404 /custom_404.html;
    location = /custom_404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Использование directive alias для папки /docs
    location /docs {
        alias /usr/share/nginx/html/docs;
        index index.html;
    }

    # Защищенный путь /admin с базовой авторизацией (auth_basic + .htpasswd)
    location /admin {
        auth_basic "Restricted Access - Admin Panel";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }

    # Ограничение частоты запросов для /api
    location /api {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://streamlit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Корневой путь — проксируем на новое React-приложение (порт 3000)
    location = / {
        proxy_pass http://react_frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статические бандлы скомпилированного React-приложения (/assets/*.js, /assets/*.css)
    location /assets/ {
        proxy_pass http://react_frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Прямой доступ к Streamlit-узлам (при необходимости)
    location /streamlit {
        proxy_pass http://streamlit_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Системные и статические пути Streamlit
    location ~ ^/(st-core|stream|_stcore|static|_ah|vendor) {
        proxy_pass http://streamlit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Всё остальное (несуществующие пути/абракадабра) принудительно возвращает 404
    location / {
        return 404;
    }
}

# 3. Второй виртуальный хост (для демонстрации виртуальных хостов по ТЗ)
server {
    listen 80;
    listen 443 ssl;
    server_name secondproject.local;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Отдает свою собственную статичку, изолированную от основного проекта
    root /usr/share/nginx/html/docs;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}