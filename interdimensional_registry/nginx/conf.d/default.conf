# Ограничение частоты запросов для /api
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upstream балансировки (кластер бэкендов)
upstream backend_cluster {
    server backend1:8000 max_fails=1 fail_timeout=5s;
    server backend2:8000 max_fails=1 fail_timeout=5s;
}

upstream frontend_cluster {
    server backend1:8501 max_fails=1 fail_timeout=5s;
    server backend2:8501 max_fails=1 fail_timeout=5s;
}

# 1. Редирект HTTP (80) -> HTTPS (443)
server {
    listen 80;
    server_name myapp.local;
    return 301 https://$host$request_uri;
}

# 2. Изолированный второй виртуальный хост
server {
    listen 80;
    listen 443 ssl;
    server_name otherapp.local;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    location / {
        default_type text/plain;
        return 200 "This is Neighboring Project (Other Host)\n";
    }
}

# 3. Основной виртуальный хост (HTTPS)
server {
    listen 443 ssl default_server;
    server_name myapp.local;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Возвращаем 429 при превышении лимита
    limit_req_status 429;

    # Кастомная страница 404
    error_page 404 /custom_404.html;
    location = /custom_404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Фронтенд Streamlit
    location / {
        proxy_pass http://frontend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Использование alias для отдельного каталога /docs
    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        index index.html;
    }

    # Балансировка /api
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_cluster/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

    }

    # Закрытый путь /admin с базовой авторизацией
    location /admin {
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        default_type text/html;
        return 200 "<h1>Welcome to Admin Panel</h1>";
    }
}